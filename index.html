<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنك الدم - لوحات المتابعة</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#1b2f3a;--mute:#647783;--line:#dde5ea;--teal:#12627a;--red:#b3243a;--side:#12313d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17252d;--ink:#e6eef1;--mute:#93a7b0;--line:#2a3b44;--teal:#4aa8c4;--red:#ef6a7d;--side:#0a1317}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Almarai',Tahoma,sans-serif;line-height:1.7;display:flex;flex-direction:column}
header{background:var(--side);color:#fff;padding:28px 24px}
header div{max-width:880px;margin:0 auto}
h1{margin:0;font-size:24px;font-weight:800}
header p{margin:2px 0 0;color:#cfdde3;font-size:14px}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:36px 20px 56px}
main>h2{margin:0 0 16px;font-size:18px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--teal)}
a.card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tag{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 10px;border-radius:4px;color:var(--teal);background:color-mix(in srgb,var(--teal) 13%,transparent)}
a.card.app .tag{color:var(--red);background:color-mix(in srgb,var(--red) 11%,transparent)}
.card h3{margin:0;font-size:20px;font-weight:800}
.card p{margin:0;color:var(--mute);font-size:14px}
.go{margin-top:auto;padding-top:8px;font-weight:700;color:var(--teal)}
a.card.app .go{color:var(--red)}
</style>
</head>
<body>
<header><div><h1>بنك الدم</h1><p>لوحات المتابعة</p></div></header>
<main>
  <h2>اختاري اللوحة</h2>
  <div class="cards">
    <a class="card web" href="https://boold-bank-85744.web.app/">
      <span class="tag">الويب</span>
      <h3>داشبورد الويب</h3>
      <p>بيانات موقع الويب: الطلبات والبنوك والمخزون والمستخدمين ووحدات الدم والتبرعات.</p>
      <span class="go">فتح اللوحة</span>
    </a>
    <a class="card app" href="https://blood-bank-724db.web.app/">
      <span class="tag">الموبايل</span>
      <h3>داشبورد الموبايل (الأبليكشن)</h3>
      <p>بيانات تطبيق الموبايل: الطلبات والبنوك والمخزون والمستخدمين.</p>
      <span class="go">فتح اللوحة</span>
    </a>
  </div>
</main>
</body>
</html>
